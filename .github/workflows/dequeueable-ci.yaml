on:
  pull_request:
    branches:
      - "main"
    paths:
      - "lib/**"
      - "tests/**"
      - "Directory.Build.props"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        dotnet-version: ['8.x.x', '9.x.x', '10.x.x']
        tfm: ['8.0', '9.0', '10.0']
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET Core SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet-version }}
      - name: Install dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --configuration Release --no-restore
      - name: Test
        run: dotnet test --no-restore --verbosity minimal --framework net${{ matrix.tfm }}